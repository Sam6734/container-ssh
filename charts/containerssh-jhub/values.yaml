# JupyterHub connection
jupyterhub:
  # Internal service URL of the JupyterHub hub pod
  url: "http://hub:8081"
  # Kubernetes secret containing the JupyterHub API token. Preferably a
  # scoped service token registered in the JupyterHub config (scopes:
  # read:users, servers, tokens) — a personal admin token also works.
  adminTokenSecret:
    name: containerssh
    key: jhub-admin-token
  # Namespace where JupyterHub user pods run (defaults to Release.Namespace)
  userNamespace: ""

# SSH service configuration
service:
  type: LoadBalancer
  port: 2222
  # Annotations for the SSH LoadBalancer service.
  # For MetalLB + ExternalDNS:
  #   external-dns.alpha.kubernetes.io/hostname: ssh.mycluster.example.org
  # For HAProxy ingress (add TCPProxy separately):
  #   haproxy.org/check: "true"
  annotations: {}
  # Optional: pin to a specific external IP (MetalLB)
  loadBalancerIP: ""

# SSH host key — must reference an existing secret with a PEM private key
ssh:
  hostKeySecret:
    name: containerssh
    key: host-key
  # Banner shown to users before authentication
  banner:
    title: "JupyterHub SSH Gateway"
    # Example username shown in banner (email with @ and . replaced by -)
    usernameExample: "firstname-last-institution-edu"
    # URL where users can get/refresh their API token
    tokenUrl: "https://yourhub.example.org/hub/token"

# Optional secret creation. By default, the chart expects you to create the
# referenced secrets yourself. With create=true the chart manages them:
# values left empty are auto-generated (random API token, RSA host key),
# values already present in an existing secret are preserved across
# upgrades, and the secrets are kept on uninstall (helm.sh/resource-policy).
secret:
  create: false
  annotations: {}
  # Plain text JupyterHub API token. Leave empty to auto-generate; after
  # install, register the generated token as a JupyterHub service token
  # (see README "Registering the JupyterHub service").
  jupyterhubAdminToken: ""
  # Plain text SSH private host key (PEM). Leave empty to auto-generate.
  sshHostKey: ""

# Token expiry policy (applies to non-admin users only)
tokens:
  maxAgeDays: 7
  cleanup:
    enabled: true
    # Cron schedule for the cleanup job
    schedule: "0 2 * * *"
    # Set to true to log what would be deleted without deleting
    dryRun: false

# Launcher pod — ContainerSSH persistent pod that bridges SSH to JupyterHub pods
launcher:
  # Name of the launcher pod (must match ContainerSSH config webhook output)
  podName: containerssh-launcher

# Direct-to-notebook-pod routing.
#
# With this enabled the config webhook execs into the user's own singleuser pod
# whenever it is already running, so shell, exec (scp, rsync, VS Code
# Remote-SSH) and subsystem (sftp) requests all reach the user's filesystem.
# Users with no running server still get the launcher's interactive image
# picker, and any lookup failure falls back to the launcher too.
#
# Requires the ContainerSSH guest agent inside the singleuser pod — deliver it
# with an initContainer rather than rebuilding every image; see the
# "Singleuser pod agent" section of the README.
userPod:
  enabled: true
  # Label selector identifying JupyterHub singleuser pods
  selector: "component=singleuser-server"
  # Container within the singleuser pod to attach to
  notebookContainer: notebook
  # Path to the ContainerSSH guest agent inside the singleuser pod.
  #
  # Empty by default, which sends disableAgent and needs no image changes: a
  # login shell, scp -O and VS Code Remote-SSH all work without the agent, and
  # TERM comes from the image's own environment. The only real loss is SSH
  # signal forwarding (interactive Ctrl+C still works — that is the in-container
  # TTY, not SSH signalling).
  #
  # Set this ONLY once the binary is actually present, e.g. via the
  # initContainer in examples/singleuser-agent-values.yaml. A path that does
  # not exist is fatal: ContainerSSH execs it and the session dies with no
  # fallback. An empty value is safe; a wrong value is not.
  agentPath: ""
  shellCommand: "/bin/bash -l"
  # Comma-separated name=path pairs, e.g.
  # "sftp=/opt/containerssh/sftp-server". Leave empty until the executable
  # actually exists in the image — a missing binary makes the request fail.
  subsystems: ""

# Images
image:
  auth:
    repository: ghcr.io/sam6734/containerssh-auth
    tag: latest
    pullPolicy: IfNotPresent
  config:
    repository: ghcr.io/sam6734/containerssh-config
    tag: latest
    pullPolicy: IfNotPresent
  launcher:
    repository: ghcr.io/sam6734/containerssh-launcher
    tag: latest
    pullPolicy: IfNotPresent
  containerssh:
    repository: containerssh/containerssh
    tag: "v0.6"
    pullPolicy: IfNotPresent

# Resource limits
resources:
  auth:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  config:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  launcher:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  containerssh:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# RBAC — the containerssh service account needs to exec into user pods
rbac:
  create: true
  serviceAccountName: containerssh
