jupyterhub:
  url: "http://hub.cmsaf-dev.svc.cluster.local:8081"
  adminTokenSecret:
    name: containerssh
    key: jhub-admin-token
  userNamespace: "cmsaf-dev"

service:
  type: LoadBalancer
  port: 2222
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ssh.cmsaf-dev.flatiron.hollandhpc.org
  loadBalancerIP: "129.93.179.28"

ssh:
  hostKeySecret:
    name: containerssh
    key: host-key
  banner:
    title: "Coffea Casa SSH Gateway  (cmsaf-dev)"
    usernameExample: "firstname-last-unl-edu"
    tokenUrl: "https://hub.cmsaf-dev.flatiron.hollandhpc.org/hub/token"

# The chart manages the secret: the API token was auto-generated on install
# and is preserved across upgrades. The same token is registered as the
# `containerssh` JupyterHub service in the z2jh values (coffea-casa-config),
# and the secret itself is committed there as a SealedSecret.
secret:
  create: true

tokens:
  maxAgeDays: 7
  cleanup:
    enabled: true
    schedule: "0 2 * * *"
    dryRun: false

launcher:
  podName: containerssh-launcher

# Exec straight into the user's own singleuser pod when their server is
# running, so shell, exec (scp, VS Code Remote-SSH) and subsystem requests all
# land on their own filesystem. Users with no running server still get the
# launcher's image picker, and any lookup failure falls back to it too.
userPod:
  enabled: true
  # Both of these require the ssh-tools initContainer from
  # ../singleuser-agent-values.yaml to be present in the z2jh values, which it
  # is for cmsaf-dev. An empty agentPath is safe; a path to a missing binary is
  # fatal, because ContainerSSH execs it with no fallback — so if the
  # initContainer is ever removed, blank this out in the same change.
  agentPath: /opt/containerssh/containerssh-agent
  # Makes plain "scp" and "sftp" work. Without it ContainerSSH looks for
  # /usr/lib/openssh/sftp-server, which does not exist on AlmaLinux, and users
  # have to fall back to "scp -O".
  subsystems: "sftp=/opt/containerssh/sftp-server"

image:
  auth:
    repository: ghcr.io/sam6734/containerssh-auth
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  config:
    repository: ghcr.io/sam6734/containerssh-config
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  launcher:
    repository: ghcr.io/sam6734/containerssh-launcher
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  containerssh:
    repository: containerssh/containerssh
    tag: "v0.6"
    pullPolicy: IfNotPresent

rbac:
  create: true
  serviceAccountName: containerssh
